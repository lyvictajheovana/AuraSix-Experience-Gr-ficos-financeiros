<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AuraSix Exchange Elite</title>

<!-- Versões compatíveis -->
<script src="https://cdn.jsdelivr.net/npm/chart.js@3.9.1"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-chart-financial@3.3.0"></script>
<script src="https://cdn.jsdelivr.net/npm/luxon@3.4.4"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-luxon@1.3.1"></script>

<style>
body{
    margin:0;
    background:#0b1220;
    font-family:Segoe UI, Arial, sans-serif;
    color:#e5e7eb;
}

header{
    padding:20px;
    text-align:center;
    font-size:24px;
    font-weight:bold;
    color:#22c55e;
}

.container{
    width:95%;
    margin:auto;
}

.grid{
    display:grid;
    grid-template-columns: 3fr 1fr;
    gap:20px;
}

.card{
    background:#111827;
    padding:20px;
    border-radius:16px;
}

canvas{
    background:#0f172a;
    border-radius:12px;
}

.stat{
    margin-bottom:15px;
}
</style>
</head>
<body>

<header>📈 AuraSix Exchange Elite</header>

<div class="container">

<div class="grid">

<div class="card">
<canvas id="candleChart"></canvas>
</div>

<div class="card">
<div class="stat"><strong>Valor Atual:</strong> <span id="valorAtual"></span></div>
<div class="stat"><strong>Variação:</strong> <span id="variacao"></span></div>
<div class="stat"><strong>Gastos:</strong> <span id="gastos"></span></div>
<div class="stat"><strong>Lucro:</strong> <span id="lucro"></span></div>
</div>

</div>

<div class="card" style="margin-top:20px;">
<canvas id="volumeChart"></canvas>
</div>

</div>

<script>

let precoAtual = 150000;
let dados = [];
let volumeData = [];

function randomReal(min,max){
    return parseFloat((Math.random()*(max-min)+min).toFixed(2));
}

function gerarCandle(){

    let open = precoAtual;
    let variacao = randomReal(-60000,60000);
    let close = open + variacao;

    if(close < 5000) close = randomReal(5000,20000);
    if(close > 1000000) close = randomReal(800000,1000000);

    let high = Math.max(open,close) + randomReal(0,20000);
    let low = Math.min(open,close) - randomReal(0,20000);

    precoAtual = close;

    return {open,high,low,close};
}

const ctx = document.getElementById("candleChart").getContext("2d");

const candleChart = new Chart(ctx,{
    type:"candlestick",
    data:{
        datasets:[{
            label:"AuraSix Market",
            data:dados,
            color:{
                up:"#22c55e",
                down:"#ef4444",
                unchanged:"#999"
            }
        }]
    },
    options:{
        scales:{
            x:{type:'time', time:{unit:'minute'}},
            y:{}
        }
    }
});

const ctxVol = document.getElementById("volumeChart").getContext("2d");

const volumeChart = new Chart(ctxVol,{
    type:"bar",
    data:{
        labels:[],
        datasets:[{
            label:"Volume Financeiro",
            data:[],
            backgroundColor:[]
        }]
    }
});

function atualizarPainel(open,close){

    let variacao = ((close-open)/open)*100;
    let gastos = close*0.45;
    let lucro = close-gastos;

    document.getElementById("valorAtual").innerHTML =
        "R$ "+close.toLocaleString("pt-BR",{minimumFractionDigits:2});

    document.getElementById("variacao").innerHTML =
        variacao.toFixed(2)+"%";

    document.getElementById("gastos").innerHTML =
        "R$ "+gastos.toLocaleString("pt-BR",{minimumFractionDigits:2});

    document.getElementById("lucro").innerHTML =
        "R$ "+lucro.toLocaleString("pt-BR",{minimumFractionDigits:2});
}

function adicionarMovimento(){

    let candle = gerarCandle();

    dados.push({
        x:new Date(),
        o:candle.open,
        h:candle.high,
        l:candle.low,
        c:candle.close
    });

    let vol = randomReal(200000,900000);
    volumeData.push(vol);

    if(dados.length>30){
        dados.shift();
        volumeData.shift();
    }

    volumeChart.data.labels = dados.map((_,i)=>i+1);
    volumeChart.data.datasets[0].data = volumeData;
    volumeChart.data.datasets[0].backgroundColor =
        dados.map(d => d.c >= d.o ? "#22c55e" : "#ef4444");

    candleChart.update();
    volumeChart.update();

    atualizarPainel(candle.open,candle.close);
}

setInterval(()=>{
    adicionarMovimento();
},2000);

</script>

</body>
</html>
