<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AuraSix Market</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body{
    margin:0;
    background:#0f172a;
    font-family:Arial, sans-serif;
    color:white;
    text-align:center;
}

h1{
    padding:20px;
    color:#22c55e;
}

.container{
    width:95%;
    margin:auto;
}

.card{
    background:#1e293b;
    padding:20px;
    border-radius:12px;
    margin-bottom:20px;
}

button{
    padding:12px 25px;
    border:none;
    border-radius:8px;
    background:#22c55e;
    color:black;
    font-weight:bold;
    cursor:pointer;
}

button:hover{
    background:#16a34a;
}

canvas{
    background:#0b1220;
    border-radius:12px;
}
</style>
</head>
<body>

<h1>📈 AuraSix Bolsa Financeira</h1>

<div class="container">

<div class="card">
<button onclick="iniciarMercado()">▶ Iniciar Mercado</button>
<p id="status">Mercado parado</p>
</div>

<div class="card">
<canvas id="grafico"></canvas>
</div>

<div class="card">
<p id="dadosFinanceiros"></p>
</div>

</div>

<script>

let rodando = false;
let precoAtual = 100000;
let dados = [];
let labels = [];
let intervalo;

function numeroRealista(min,max){
    return parseFloat((Math.random()*(max-min)+min).toFixed(2));
}

const ctx = document.getElementById("grafico").getContext("2d");

const grafico = new Chart(ctx,{
    type:"line",
    data:{
        labels:labels,
        datasets:[{
            label:"AuraSix Market Value",
            data:dados,
            borderWidth:3,
            tension:0.3,
            pointRadius:0,
            fill:true
        }]
    },
    options:{
        scales:{
            x:{ticks:{color:"#94a3b8"}},
            y:{ticks:{color:"#94a3b8"}}
        },
        plugins:{
            legend:{labels:{color:"white"}}
        }
    }
});

function atualizarPainel(){

    let gastos = precoAtual * 0.45;
    let lucro = precoAtual - gastos;

    document.getElementById("dadosFinanceiros").innerHTML =
        "💰 Valor Atual: R$ "+precoAtual.toLocaleString("pt-BR",{minimumFractionDigits:2})+"<br>"+
        "📉 Gastos: R$ "+gastos.toLocaleString("pt-BR",{minimumFractionDigits:2})+"<br>"+
        "🚀 Lucro: R$ "+lucro.toLocaleString("pt-BR",{minimumFractionDigits:2});
}

function gerarMovimento(){

    let variacao = numeroRealista(-50000,50000);
    precoAtual += variacao;

    if(precoAtual < 5000) precoAtual = numeroRealista(5000,20000);
    if(precoAtual > 1000000) precoAtual = numeroRealista(800000,1000000);

    dados.push(precoAtual);
    labels.push("T"+dados.length);

    if(dados.length > 30){
        dados.shift();
        labels.shift();
    }

    if(variacao >= 0){
        grafico.data.datasets[0].borderColor = "#22c55e";
        grafico.data.datasets[0].backgroundColor = "rgba(34,197,94,0.15)";
    } else {
        grafico.data.datasets[0].borderColor = "#ef4444";
        grafico.data.datasets[0].backgroundColor = "rgba(239,68,68,0.15)";
    }

    grafico.update();
    atualizarPainel();
}

function iniciarMercado(){

    if(!rodando){
        rodando = true;
        document.getElementById("status").innerText = "Mercado em funcionamento...";
        intervalo = setInterval(gerarMovimento,2000);
    }
}

</script>

</body>
</html>
