<script>

let preco = 250000;
let dados = [];
let labels = [];
let volume = [];
let rodando = true;
let chart;

function aleatorio(min,max){
    return parseFloat((Math.random()*(max-min)+min).toFixed(2));
}

document.addEventListener("DOMContentLoaded", function(){

    const ctx = document.getElementById("graficoPrincipal");

    chart = new Chart(ctx,{
        data:{
            labels:labels,
            datasets:[
            {
                type:"line",
                label:"Valor de Mercado",
                data:dados,
                borderWidth:3,
                tension:0.4,
                pointRadius:0,
                yAxisID:"y"
            },
            {
                type:"bar",
                label:"Volume de Eventos",
                data:volume,
                yAxisID:"y1"
            }]
        },
        options:{
            responsive:true,
            scales:{
                y:{position:"left"},
                y1:{position:"right", grid:{drawOnChartArea:false}}
            }
        }
    });

    setInterval(atualizarMercado,2000);
});

function atualizarIndicadores(){
    let gastos = preco * 0.46;
    let lucro = preco - gastos;
    let crescimentoMes = aleatorio(-5,15);

    document.getElementById("valorAtual").innerHTML =
        "💰 Valor Atual<br>R$ "+preco.toLocaleString("pt-BR",{minimumFractionDigits:2});

    document.getElementById("lucroAtual").innerHTML =
        "🚀 Lucro<br>R$ "+lucro.toLocaleString("pt-BR",{minimumFractionDigits:2});

    document.getElementById("gastosAtual").innerHTML =
        "📉 Gastos<br>R$ "+gastos.toLocaleString("pt-BR",{minimumFractionDigits:2});

    document.getElementById("crescimento").innerHTML =
        "📊 Crescimento Mensal<br>"+crescimentoMes.toFixed(2)+"%";
}

function atualizarMercado(){

    if(!rodando || !chart) return;

    let variacao = aleatorio(-90000,90000);
    preco += variacao;

    if(preco < 5000) preco = aleatorio(5000,20000);
    if(preco > 1000000) preco = aleatorio(900000,1000000);

    dados.push(preco);
    volume.push(aleatorio(10000,80000));
    labels.push("T"+dados.length);

    if(dados.length > 30){
        dados.shift();
        volume.shift();
        labels.shift();
    }

    if(variacao >= 0){
        chart.data.datasets[0].borderColor = "#00ff88";
    } else {
        chart.data.datasets[0].borderColor = "#ff4444";
    }

    chart.update();
    atualizarIndicadores();
}

function simularEventoGrande(){

    let valorEvento = aleatorio(5000,1000000);
    preco += valorEvento;

    document.getElementById("historicoEventos").innerHTML +=
        "Evento Premium registrado — R$ "+
        valorEvento.toLocaleString("pt-BR",{minimumFractionDigits:2})+"<br>";

    atualizarIndicadores();
}

function pausarMercado(){
    rodando = !rodando;
}

</script>
