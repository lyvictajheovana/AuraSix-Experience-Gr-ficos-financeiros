<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AuraSix Exchange Elite</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-chart-financial"></script>
<script src="https://cdn.jsdelivr.net/npm/luxon"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-luxon"></script>

<style>
body{
    margin:0;
    background:#0b1220;
    font-family:Segoe UI, Arial, sans-serif;
    color:#e5e7eb;
}

header{
    padding:20px;
    text-align:center;
    font-size:24px;
    font-weight:bold;
    color:#22c55e;
    letter-spacing:1px;
}

.container{
    width:95%;
    margin:auto;
}

.grid{
    display:grid;
    grid-template-columns: 3fr 1fr;
    gap:20px;
}

.card{
    background:#111827;
    padding:20px;
    border-radius:16px;
    box-shadow:0 0 20px rgba(0,0,0,0.4);
}

canvas{
    background:#0f172a;
    border-radius:12px;
}

.stat{
    margin-bottom:18px;
}

.stat-title{
    font-size:13px;
    color:#9ca3af;
}

.stat-value{
    font-size:20px;
    font-weight:bold;
}
</style>
</head>
<body>

<header>📈 AuraSix Exchange Elite</header>

<div class="container">

<div class="grid">

<div class="card">
<canvas id="candleChart"></canvas>
</div>

<div class="card">
<div class="stat">
<div class="stat-title">Valor Atual</div>
<div class="stat-value" id="valorAtual">R$ 0,00</div>
</div>

<div class="stat">
<div class="stat-title">Variação</div>
<div class="stat-value" id="variacao"></div>
</div>

<div class="stat">
<div class="stat-title">Faturamento Estimado</div>
<div class="stat-value" id="faturamento"></div>
</div>

<div class="stat">
<div class="stat-title">Gastos Operacionais</div>
<div class="stat-value" id="gastos"></div>
</div>

<div class="stat">
<div class="stat-title">Lucro Projetado</div>
<div class="stat-value" id="lucro"></div>
</div>

<div class="stat">
<div class="stat-title">Tendência</div>
<div class="stat-value" id="tendencia"></div>
</div>

</div>

</div>

<div class="card" style="margin-top:20px;">
<canvas id="volumeChart"></canvas>
</div>

</div>

<script>

let precoAtual = 120000;
let dados = [];
let volumeData = [];
let fechamentos = [];

function randomReal(min,max){
    return parseFloat((Math.random()*(max-min)+min).toFixed(2));
}

function gerarCandle(){

    let open = precoAtual;

    let variacao = randomReal(-80000,80000);
    let close = open + variacao;

    if(close < 5000) close = randomReal(5000,30000);
    if(close > 1000000) close = randomReal(800000,1000000);

    let high = Math.max(open,close) + randomReal(0,30000);
    let low = Math.min(open,close) - randomReal(0,30000);

    precoAtual = close;
    fechamentos.push(close);

    return {open,high,low,close};
}

function mediaMovel(periodo){
    if(fechamentos.length < periodo) return null;
    let soma = 0;
    for(let i=fechamentos.length-periodo;i<fechamentos.length;i++){
        soma += fechamentos[i];
    }
    return soma/periodo;
}

const ctx = document.getElementById("candleChart").getContext("2d");

const candleChart = new Chart(ctx,{
    type:"candlestick",
    data:{
        datasets:[
        {
            label:"AuraSix Market",
            data:dados,
            color:{
                up:"#22c55e",
                down:"#ef4444",
                unchanged:"#999"
            }
        },
        {
            type:"line",
            label:"Média Móvel (5)",
            data:[],
            borderColor:"#3b82f6",
            borderWidth:2,
            pointRadius:0,
            tension:0.3
        }
        ]
    },
    options:{
        plugins:{
            legend:{labels:{color:"white"}}
        },
        scales:{
            x:{ticks:{color:"#9ca3af"}},
            y:{ticks:{color:"#9ca3af"}}
        }
    }
});

const ctxVol = document.getElementById("volumeChart").getContext("2d");

const volumeChart = new Chart(ctxVol,{
    type:"bar",
    data:{
        labels:[],
        datasets:[{
            label:"Volume Financeiro",
            data:[],
            backgroundColor:[]
        }]
    },
    options:{
        plugins:{
            legend:{labels:{color:"white"}}
        },
        scales:{
            x:{ticks:{color:"#9ca3af"}},
            y:{ticks:{color:"#9ca3af"}}
        }
    }
});

function atualizarPainel(open,close){

    let variacao = ((close-open)/open)*100;

    document.getElementById("valorAtual").innerHTML =
        "R$ "+close.toLocaleString("pt-BR",{minimumFractionDigits:2});

    document.getElementById("variacao").innerHTML =
        variacao.toFixed(2)+"%";

    let faturamento = close*1.3;
    let gastos = faturamento*0.45;
    let lucro = faturamento-gastos;

    document.getElementById("faturamento").innerHTML =
        "R$ "+faturamento.toLocaleString("pt-BR",{minimumFractionDigits:2});

    document.getElementById("gastos").innerHTML =
        "R$ "+gastos.toLocaleString("pt-BR",{minimumFractionDigits:2});

    document.getElementById("lucro").innerHTML =
        "R$ "+lucro.toLocaleString("pt-BR",{minimumFractionDigits:2});

    let tendencia = mediaMovel(5);
    document.getElementById("tendencia").innerHTML =
        tendencia ? "Alta 📈" : "Estável";
}

function adicionarMovimento(){

    let candle = gerarCandle();

    dados.push({
        x:new Date(),
        o:candle.open,
        h:candle.high,
        l:candle.low,
        c:candle.close
    });

    let vol = randomReal(200000,1000000);
    volumeData.push(vol);

    if(dados.length>40){
        dados.shift();
        volumeData.shift();
        fechamentos.shift();
    }

    volumeChart.data.labels = dados.map((_,i)=>i+1);
    volumeChart.data.datasets[0].data = volumeData;

    volumeChart.data.datasets[0].backgroundColor =
        dados.map(d => d.c >= d.o ? "#22c55e" : "#ef4444");

    let mm = mediaMovel(5);
    if(mm){
        candleChart.data.datasets[1].data.push(mm);
    }else{
        candleChart.data.datasets[1].data.push(null);
    }

    candleChart.update();
    volumeChart.update();

    atualizarPainel(candle.open,candle.close);
}

setInterval(()=>{
    adicionarMovimento();
},2500);

</script>

</body>
</html>
