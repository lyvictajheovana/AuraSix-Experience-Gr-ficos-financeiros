<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AuraSix Market Pro</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-chart-financial"></script>
<script src="https://cdn.jsdelivr.net/npm/luxon"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-luxon"></script>

<style>
body{
    margin:0;
    background:#0a0f1c;
    font-family:Arial, sans-serif;
    color:white;
}

h1{
    text-align:center;
    padding:20px;
    color:#22c55e;
}

.container{
    width:95%;
    margin:auto;
}

.card{
    background:#111827;
    padding:20px;
    border-radius:12px;
    margin-bottom:20px;
}

canvas{
    background:#0f172a;
    border-radius:10px;
}
.resumo{
    text-align:center;
    font-size:18px;
}
</style>
</head>
<body>

<h1>📈 AuraSix Experience • Market Live</h1>

<div class="container">

<div class="card resumo" id="resumo"></div>

<div class="card">
<canvas id="candlestickChart"></canvas>
</div>

<div class="card">
<canvas id="volumeChart"></canvas>
</div>

</div>

<script>

let total = 7000;
let dados = [];
let volumeDados = [];

function gerarMovimento(){

    let open = total;
    let variacao = (Math.random() - 0.5) * 1500;
    let close = open + variacao;

    if(close < 5000) close = 5000;
    if(close > 9000) close = 9000;

    let high = Math.max(open, close) + Math.random()*500;
    let low = Math.min(open, close) - Math.random()*500;

    total = close;

    return {open, high, low, close};
}

function atualizarResumo(){
    let gastos = total * 0.5;
    let lucro = total - gastos;

    document.getElementById("resumo").innerHTML =
        "💰 Valor Atual: R$ "+total.toFixed(2)+" | "+
        "📉 Gastos: R$ "+gastos.toFixed(2)+" | "+
        "🚀 Lucro Estimado: R$ "+lucro.toFixed(2);
}

const ctx = document.getElementById('candlestickChart').getContext('2d');

const candlestickChart = new Chart(ctx, {
    type: 'candlestick',
    data: {
        datasets: [{
            label: 'AuraSix Market',
            data: dados,
            color: {
                up: '#22c55e',
                down: '#ef4444',
                unchanged: '#999'
            }
        }]
    },
    options: {
        plugins: {
            legend: { labels:{color:'white'} }
        },
        scales: {
            x: {
                ticks:{color:'#94a3b8'}
            },
            y: {
                ticks:{color:'#94a3b8'}
            }
        }
    }
});

const ctxVolume = document.getElementById('volumeChart').getContext('2d');

const volumeChart = new Chart(ctxVolume,{
    type:'bar',
    data:{
        labels:[],
        datasets:[{
            label:'Volume de Eventos',
            data:[],
            backgroundColor:'#3b82f6'
        }]
    },
    options:{
        plugins:{
            legend:{labels:{color:'white'}}
        },
        scales:{
            x:{ticks:{color:'#94a3b8'}},
            y:{ticks:{color:'#94a3b8'}}
        }
    }
});

function adicionarCandle(){

    let movimento = gerarMovimento();

    dados.push({
        x: new Date(),
        o: movimento.open,
        h: movimento.high,
        l: movimento.low,
        c: movimento.close
    });

    volumeDados.push(Math.floor(Math.random()*10)+1);

    if(dados.length > 20){
        dados.shift();
        volumeDados.shift();
    }

    volumeChart.data.labels = dados.map((_,i)=>i+1);
    volumeChart.data.datasets[0].data = volumeDados;

    candlestickChart.update();
    volumeChart.update();
    atualizarResumo();
}

setInterval(()=>{
    adicionarCandle();
},3000);

</script>

</body>
</html>
