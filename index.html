<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AuraSix Experience • Market Finance</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body{
    margin:0;
    background:#0b0f1a;
    font-family:Arial, sans-serif;
    color:white;
}

h1{
    text-align:center;
    padding:20px;
    color:#22c55e;
}

.container{
    width:95%;
    margin:auto;
}

.card{
    background:#121826;
    padding:20px;
    border-radius:12px;
    margin-bottom:20px;
}

canvas{
    background:#0f172a;
    border-radius:10px;
}

.resumo{
    font-size:18px;
    text-align:center;
}
</style>
</head>
<body>

<h1>📈 AuraSix Experience • Bolsa Financeira</h1>

<div class="container">

<div class="card resumo" id="resumo"></div>

<div class="card">
<canvas id="graficoBolsa"></canvas>
</div>

</div>

<script>

let valores = [];
let labels = [];
let total = 0;

function gerarValor(){
    return parseFloat((Math.random() * (9000 - 5000) + 5000).toFixed(2));
}

function atualizarResumo(){
    let gastos = total * 0.5;
    let lucro = total - gastos;

    document.getElementById("resumo").innerHTML =
        "💰 Faturamento: R$ "+total.toFixed(2)+" | "+
        "📉 Gastos: R$ "+gastos.toFixed(2)+" | "+
        "🚀 Lucro: R$ "+lucro.toFixed(2);
}

let ctx = document.getElementById("graficoBolsa").getContext("2d");

let grafico = new Chart(ctx,{
    type:"line",
    data:{
        labels:labels,
        datasets:[{
            label:"AuraSix Market Value",
            data:valores,
            borderColor:"#22c55e",
            backgroundColor:"rgba(34,197,94,0.15)",
            fill:true,
            tension:0.3,
            pointRadius:0
        }]
    },
    options:{
        animation:{
            duration:800
        },
        scales:{
            x:{
                ticks:{color:"#94a3b8"}
            },
            y:{
                ticks:{color:"#94a3b8"}
            }
        },
        plugins:{
            legend:{
                labels:{color:"white"}
            }
        }
    }
});

function adicionarEvento(){

    let novo = gerarValor();
    total += novo;

    valores.push(total);
    labels.push("T"+valores.length);

    if(valores.length > 20){
        valores.shift();
        labels.shift();
    }

    let ultimo = valores[valores.length-2] || 0;

    if(total >= ultimo){
        grafico.data.datasets[0].borderColor = "#22c55e";
        grafico.data.datasets[0].backgroundColor = "rgba(34,197,94,0.15)";
    } else {
        grafico.data.datasets[0].borderColor = "#ef4444";
        grafico.data.datasets[0].backgroundColor = "rgba(239,68,68,0.15)";
    }

    grafico.update();
    atualizarResumo();
}

setInterval(()=>{
    adicionarEvento();
},3000);

</script>

</body>
</html>
